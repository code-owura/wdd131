<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - KickOff Central</title>
    <meta name="description"
        content="Save your favorite football teams and players on KickOff Central using our easy form.">
    <meta name="author" content="Kwadwo Adu Nsiah Ahenkan">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/favorites.js" defer></script>
</head>

<body>
    <header>
        <div class="logo-box">
            <img src="images/kickoff-central.webp" alt="KickOff Central Logo" class="logo-image" width="80" height="80">
            <h2 class="site-name">KickOff Central</h2>
        </div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="favorites.html" class="active">Favorites</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-banner small">
            <div class="hero-text">
                <h1>My Favorite Teams</h1>
                <p>Add and manage your favorite football teams</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add a Favorite Team</h2>
            <form id="favorite-form" method="get" action="favorites.html">

                <div class="input-block">
                    <label for="team-name">Team Name <span class="required">*</span></label>
                    <input type="text" id="team-name" name="team-name" required>
                </div>

                <div class="input-block">
                    <label for="league">League <span class="required">*</span></label>
                    <select id="league" name="league" required>
                        <option value="" disabled selected>Select a League ...</option>
                        <option value="Premier League">Premier League</option>
                        <option value="La Liga">La Liga</option>
                        <option value="Serie A">Serie A</option>
                        <option value="Bundesliga">Bundesliga</option>
                        <option value="Ligue 1">Ligue 1</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <fieldset class="rating">
                    <legend>How much do you love this team? <span class="required">*</span></legend>
                    <div class="rating-options">
                        <label for="rating1">
                            <span aria-hidden="true">⭐</span>
                            <span class="sr-only">1 star</span>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </label>
                        <label for="rating2">
                            <span aria-hidden="true">⭐⭐</span>
                            <span class="sr-only">2 stars</span>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </label>
                        <label for="rating3">
                            <span aria-hidden="true">⭐⭐⭐</span>
                            <span class="sr-only">3 stars</span>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </label>
                        <label for="rating4">
                            <span aria-hidden="true">⭐⭐⭐⭐</span>
                            <span class="sr-only">4 stars</span>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </label>
                        <label for="rating5">
                            <span aria-hidden="true">⭐⭐⭐⭐⭐</span>
                            <span class="sr-only">5 stars</span>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </label>
                    </div>
                </fieldset>

                <div class="input-block">
                    <label for="comments">Why do you love this team? <span class="optional">(Optional)</span></label>
                    <textarea id="comments" name="comments" rows="4"></textarea>
                </div>

                <input type="submit" value="Add to Favorites">
            </form>
        </section>

        <section class="favorites-display">
            <h2>Your Favorite Teams</h2>
            <p id="favorites-count">You have 0 favorite teams.</p>
            <div id="favorites-list"></div>
            <button id="clear-all-btn" class="clear-button">Clear All Favorites</button>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> KickOff Central | Kwadwo Adu Nsiah Ahenkan | Accra, Ghana</p>
        <p id="lastModified"></p>
        <p><a href="references.html">References</a></p>
    </footer>
</body>

</html>
